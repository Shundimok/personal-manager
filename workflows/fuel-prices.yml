name: Update fuel prices

on:
  schedule:
    # Elke 6 uur (UTC). Pas gerust aan als je vaker/minder vaak wil verversen.
    - cron: '0 */6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run fuel scraper
        run: python fuel_scraper.py

      - name: Commit and push if changed
        run: |
          git config user.name "fuel-price-bot"
          git config user.email "actions@users.noreply.github.com"
          if ! git diff --quiet -- fuel_prices.json; then
            git add fuel_prices.json
            git commit -m "Automatische update brandstofprijzen"
            git push
          else
            echo "Geen wijzigingen in fuel_prices.json — niets te committen."
          fi
